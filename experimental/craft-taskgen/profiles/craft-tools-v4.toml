# CRAFT Tool Orchestration task generation profile v4
# Tuned for 12-CPU xlarge instance after the direct-API refactor.
# Efficiency wins (no claude -p agent-loop overhead, no Haiku smoke,
# MAX_TRIAGE_REGENS=1, alignment-time rejection of bad instructions)
# are spent on broader coverage (more promising PRs per repo) rather
# than shorter wall-time.

[models]
opus_model = "claude-opus-4-6"
haiku_model = "claude-haiku-4-5"
llm_step_model = "claude-opus-4-6"
claude_code_version = "2.1.118"
# Codex + GPT-5.5 attempts the task; Opus judges the result.
# The catalog and Codex patch preserve the bare gpt-5.5 model ID.
# Set smoke_agent="claude-code" and smoke_model to the Opus model ID
# to use Claude Code + Opus for the task attempt.
smoke_agent = "codex"
smoke_model = "gpt-5.5"
smoke_reasoning_effort = "high"

[pipeline]
max_fix_attempts = 2        # docker-build + F2P/P2P classify fix stages. Empirical across all Apr 21-24 runs: fa=0→3.1% accept, fa=1→8.7% accept (29/334), fa=2→0%, fa=3→0%, fa=4→0%. 1st retry recovers real tasks; 2nd+ are pure waste. Prior claim of "retries≥1 yield 0%" was wrong cut — it included the fa=1 successes.
max_triage_regens = 1       # empirically optimal per Apr 17 cohort (commit 6d891dc)
build_n_candidates = 3              # parallel build+alignment loops per task. Apr 25 calibration on rerun-accepts-v2: N=3 + α=1 + r=2 yielded 79/80 vs N=2's 77/80, at lower cost. Capped at 4.
alignment_max_retries = 1            # assessor retention retries per evaluation (re-poll same instruction). α=1 disables retention bias; α=3 was the prior "false-alarm hack." Capped at [1,5].
max_build_regens_per_candidate = 2   # max alignment-feedback-driven Build regens per candidate. r=2 lets a candidate try 3 different instructions in sequence (initial + 2 retries with cumulative feedback). Capped at [0,3].
max_smoke_retries = 2
max_promising_per_repo = 25
default_timeout = 1800
default_concurrency = 6     # trimmed 8->6 on Apr 25 batch 8: load avg 60+/swap 97% under the N=3 build+align config; was driving build_dockerfile burst peak past 12 concurrent containers
llm_concurrency = 10        # direct-API is async; offloaded to gateway (no local cost), capped to avoid gateway throttling
docker_concurrency = 5      # trimmed 6->5 to keep buildx CPU spikes bounded
smoke_concurrency = 6       # trimmed 8->6: Opus smoke containers hold ~1.5-2GB each throughout; 6 keeps peak at ~12 concurrent containers, leaves ~4GB memory headroom
task_suite_dir = "harbor-tasks/craft-tools-v4"
