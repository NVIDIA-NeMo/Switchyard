[package]
name = "switchyard-desktop"
version = "0.3.0"
description = "Installer, desktop app, terminal app, and usage summary for a local Switchyard server"
authors = ["NVIDIA Corporation"]
edition = "2024"
homepage = "https://github.com/NVIDIA-NeMo/Switchyard"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA-NeMo/Switchyard"
rust-version = "1.96.1"
publish = false
default-run = "switchyard-desktop"

# The app is experimental, so it builds as its own workspace with its own lock file.
[workspace]
resolver = "3"

[dependencies]
switchyard-runner = { path = "../../crates/switchyard-runner", version = "0.3.0" }
switchyard-costs = { path = "../../crates/switchyard-costs", version = "0.3.0" }
switchyard-protocol = { path = "../../crates/protocol", version = "0.3.0" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
toml = "0.9"
toml_edit = "0.25"
url = "2"
uuid = { version = "1", features = ["v7"] }
# Popups and the Data errors panel use Paragraph::line_count to size wrapped text.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
shlex = "2"
windows-args = "0.2"
strum = { version = "0.28", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer"] }
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWorkspace", "NSAccessibility", "NSApplication", "NSPanel", "NSColor", "NSWindow", "NSView", "NSScreen", "NSEvent", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSResponder", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSURL", "NSProcessInfo"] }
security-framework = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Vendored libdbus builds without the libdbus-1 development package on Ubuntu or Arch.
[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "4.1", features = ["crypto-rust", "vendored"] }

[target.'cfg(windows)'.dependencies]
mslnk = "0.1.8"
self-replace = "1.5"
windows = { version = "0.62.2", features = ["Management_Deployment", "ApplicationModel"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security_Credentials", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
rfd = { version = "0.17", default-features = false }
tauri = { version = "2", features = ["tray-icon", "custom-protocol", "macos-private-api"] }

[target.'cfg(any(target_os = "macos", windows))'.build-dependencies]
tauri-build = "2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
plist = "1"
