[package]
name = "switchyard-menubar"
version.workspace = true
description = "Desktop and terminal app for a local Switchyard server"
authors.workspace = true
edition.workspace = true
homepage = "https://github.com/NVIDIA-NeMo/Switchyard"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
toml = "0.9"
toml_edit = "0.25"
url = "2"
uuid.workspace = true
ratatui = "0.30.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }

[target.'cfg(target_os = "macos")'.build-dependencies]
tauri-build = "2"

[dev-dependencies]
# The tests check each edited config with the server's own config parser.
switchyard-runner.workspace = true
