# Rates are USD per million text tokens. Each group lists the exact IDs that share its rates.
# Groups expand into individual model lookups when this file is loaded.
# These defaults stay fixed until Switchyard is updated; an override replaces this table.
# Estimates exclude service tiers, long-context premiums, tools, and time-based cache storage.
# OpenAI cache-write rates cover 30-minute retention, not 12-hour retention.

# OpenRouter IDs in this file use the advertised token rates from 2026-10-21.
# https://openrouter.ai/api/v1/models
# OpenRouter rates can differ from direct-provider rates and can change with the selected provider.
# This table uses the input rate for OpenRouter cache reads without a published discount.
# This table uses the input rate for OpenRouter cache writes without a separate fee.
# OpenRouter's Google cache-write fields describe time-based storage.
# This table uses the input rate for those Google cache writes.
# This table excludes long-context, service-tier, and time-of-day adjustments.

# OpenAI's standard short-context rates were checked on 2026-10-21.
# https://developers.openai.com/api/docs/pricing
# GPT-5.6 and newer use the default 30-minute cache-write rate.
# codex-auto-review uses the gpt-6-sol rates for cost and baseline estimates.
# Gateway estimates use list rates where shown; a reported charge takes precedence.
# Older models have no extra write fee, so separately counted writes use the input rate.

