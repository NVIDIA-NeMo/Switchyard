[project]
name = "prefill-router-tests"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.0",
    "numpy>=1.26",
    "torch>=2.0",
    "transformers>=5.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
