[package]
name = "switchyard-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Node.js composite routing bindings for Switchyard"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt", "dyn-symbols"] }
napi-derive = "3"
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
switchyard-libsy = { workspace = true, features = ["metrics"] }
switchyard-protocol.workspace = true
switchyard-token-prediction.workspace = true
opentelemetry = { version = "0.32", default-features = false, features = ["metrics"] }

[build-dependencies]
napi-build = "2"
