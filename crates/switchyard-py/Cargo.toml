[package]
name = "switchyard-py"
version.workspace = true
description = "PyO3 bindings for Switchyard Rust crates"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "_switchyard_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
http.workspace = true
parking_lot.workspace = true
switchyard-libsy.workspace = true
switchyard-llm-client.workspace = true
pyo3 = { version = "0.28.3", features = ["abi3-py312", "extension-module"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
pythonize = "0.28.0"
serde.workspace = true
serde_json.workspace = true
switchyard-protocol.workspace = true
switchyard-server.workspace = true
switchyard-components.workspace = true
switchyard-translation.workspace = true
tokio.workspace = true
tracing.workspace = true
