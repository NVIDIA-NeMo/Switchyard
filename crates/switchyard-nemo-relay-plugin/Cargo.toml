[package]
name = "switchyard-nemo-relay-plugin"
version = "0.1.0"
description = "Switchyard-owned HTTP routing plugin for NeMo Relay"
authors = ["NVIDIA Corporation"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA-NeMo/Switchyard"
rust-version = "1.96.1"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
async-channel = "2"
async-trait = "0.1"
futures-util = "0.3"
http = "1"
nemo-relay-plugin = "=0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
switchyard-libsy = { path = "../libsy", version = "0.2.0" }
switchyard-llm-client = { path = "../libsy-llm-client", version = "0.2.0" }
switchyard-protocol = { path = "../protocol", version = "0.2.0" }
switchyard-translation = { path = "../switchyard-translation", version = "0.2.0" }
tokio = { version = "1", features = ["full"] }

# Keep the dynamic plugin self-contained so adding it does not modify the root
# Switchyard workspace manifest or lockfile.
[workspace]
