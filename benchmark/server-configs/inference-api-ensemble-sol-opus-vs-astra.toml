schema_version = 1

[llm_clients.inference]
format = "openai_responses"
base_url = "https://api.example.com/v1" # Replace with your OpenAI-compatible gateway.
api_key_env = "NVIDIA_API_KEY"
max_retries = 0

[targets.sol]
id = "azure/openai/gpt-5.6-sol"
llm_client = "inference"

[targets.opus]
id = "azure/anthropic/claude-opus-5"
llm_client = "inference"

[targets.astra]
id = "azure/openai/gpt-6-astra"
llm_client = "inference"

[routes.astra]
id = "astra"
type = "passthrough"
target = "astra"

[routes.fusion]
id = "fusion"
type = "ensemble"
candidates = ["sol", "opus"]
synthesizer_target = "sol"
minimum_successful_candidates = 2
candidate_max_output_tokens = 2048
