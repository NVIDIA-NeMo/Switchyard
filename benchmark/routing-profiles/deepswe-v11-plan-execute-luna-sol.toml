#
# Plan/execute routing for DeepSWE v1.1: GPT-5.6 Sol inspects the repository and
# plans through read-only turns. Its first mutation hands the full trajectory to
# GPT-5.6 Luna, which executes the plan for the rest of the session.
# See docs/routing_algorithms/plan_execute_routing.md.
#
# Measured on:
#   Switchyard     commit 08136d7d2ed4f862e5b3dd83488b3f120457d0ac,
#                  config schema version 1
#   Planner        OpenAI GPT-5.6 Sol, reasoning effort `max`
#   Executor       OpenAI GPT-5.6 Luna, reasoning effort `max`
#   Benchmark      DeepSWE v1.1 (github.com/datacurve-ai/deep-swe), all 113 tasks,
#                  closed-book with sandbox network policy `default_deny`
#   Agent          Codex CLI 0.154.0 calling this route with model name
#                  `switchyard`; Harbor 0.13.2 ran 5, 5, and 8 tasks at a time
#   Scoring        strict: reward 1 over all 113 tasks regardless of evaluation
#                  status. k=3 independent runs, mean +/- sample standard deviation
#   Result         60.8% +/- 5.3 solved at $180.51 +/- 9.43 per run
#   Anchors        same harness and conditions, k=3: Sol alone 62.8% +/- 3.1 at
#                  $720.95 +/- 19.47 per run. Luna alone 51.0% +/- 3.7 at
#                  $50.02 +/- 1.04 per run
#   Pricing        OpenRouter standard per-token list prices frozen 2026-09-09,
#                  promotional pricing excluded
#
# The routing parameters below are exactly as run. The measured runs reached the
# same models through NVIDIA Inference Hub. This profile uses OpenRouter so it can
# run as written with an `OPENROUTER_API_KEY`. Absolute results may vary by serving
# stack.
#
#   switchyard-server --config benchmark/routing-profiles/deepswe-v11-plan-execute-luna-sol.toml --port 4000

schema_version = 1

[llm_clients.openrouter]
format = "openai_responses"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[targets.planner]
id = "openai/gpt-5.6-sol"
llm_client = "openrouter"
reasoning_effort = "max"

[targets.executor]
id = "openai/gpt-5.6-luna"
llm_client = "openrouter"
reasoning_effort = "max"

[routes.switchyard]
id = "switchyard"
type = "plan_execute"
capable_target = "planner"
efficient_target = "executor"
planning_prompt = "You are in the planning phase. Inspect the task and the relevant code, then form a concrete implementation plan before modifying any files. Use read-only tools as needed. Do not make an edit until the plan is complete. After completing the plan, immediately make the first edit in the same task to hand execution off. Do not finish or return a final response with only the plan."
