schema_version = 1

[llm_clients.openrouter]
format = "openai_responses"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[targets.capable]
id = "openai/gpt-6-astra"
llm_client = "openrouter"
reasoning_effort = "max"

[targets.efficient]
id = "openai/gpt-6-luna"
llm_client = "openrouter"
reasoning_effort = "max"

[routes.stage]
id = "switchyard"
type = "stage_router"
capable_target = "capable"
efficient_target = "efficient"
picker = "capable_first"
confidence_threshold = 0.0
recent_turn_window = 3
capable_hold_turns = 0
efficient_hold_turns = -1
capable_system_prompt = "You are in the planning phase. Inspect the task and the relevant code, then form a concrete implementation plan before modifying any files. Use read-only tools as needed. Do not make an edit until the plan is complete. After completing the plan, immediately make the first edit in the same task to hand execution off. Do not finish or return a final response with only the plan."
