[package]
name = "switchyard-openshell-middleware"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
jsonwebtoken = { version = "10.4", features = ["aws_lc_rs"] }
parking_lot = "0.12"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
switchyard-protocol = { path = "../../crates/protocol" }
switchyard-runner = { path = "../../crates/switchyard-runner" }
switchyard-translation = { path = "../../crates/switchyard-translation" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["tls-aws-lc"] }
tonic-prost = "0.14"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
aws-lc-rs = "1"
pem = "3"
tempfile = "3"
wiremock = "0.6"
