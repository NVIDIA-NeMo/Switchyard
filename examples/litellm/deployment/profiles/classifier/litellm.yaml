model_list:
  # Classifier roles follow declaration order: capable first, efficient second.
  - model_name: switchyard
    litellm_params:
      model: openrouter/openai/gpt-5.6-sol
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: switchyard
    litellm_params:
      model: openrouter/openai/gpt-5.6-terra
      api_key: os.environ/OPENROUTER_API_KEY
  # The judge is its own model group: never a routing candidate, called by the
  # plugin through this same proxy, so its spend is tracked like any other call.
  - model_name: switchyard-judge
    litellm_params:
      model: openrouter/openai/gpt-5.6-terra
      api_key: os.environ/OPENROUTER_API_KEY

router_settings:
  plugins:
    - switchyard_litellm.configuration.configured_plugin.ROUTING_PLUGIN

litellm_settings:
  callbacks:
    - switchyard_litellm.configuration.configured_plugin.ROUTING_PLUGIN
