endpoint = "http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query"
poll_interval_ms = 1000
timeout_ms = 500

# Replace these with your Prometheus target labels, present on both up and SGLang gauges.
# Each selector must include every engine metrics target for that pool, and no other ports.
[[models]]
model = "Qwen/Qwen3-0.6B"
selector = 'namespace="switchyard", service="qwen-small-metrics"'

[[models]]
model = "Qwen/Qwen3-1.7B"
selector = 'namespace="switchyard", service="qwen-large-metrics"'
