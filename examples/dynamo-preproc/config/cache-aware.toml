schema_version = 1

# Native Switchyard runner configuration.
# Both models must be suitable for every request on this route.
[llm_clients.dynamo]
format = "openai_chat"
base_url = "http://switchyard-gateway/v1"

[targets.qwen-small]
id = "Qwen/Qwen3-0.6B"
llm_client = "dynamo"

[targets.qwen-large]
id = "Qwen/Qwen3-1.7B"
llm_client = "dynamo"

[routes.cache]
id = "auto"
type = "cache_aware"
targets = ["qwen-small", "qwen-large"]
# Relative work costs, not latency estimates. Calibrate for your deployment.
prefill_costs = [1.0, 1.0]
max_signal_age_ms = 1000
