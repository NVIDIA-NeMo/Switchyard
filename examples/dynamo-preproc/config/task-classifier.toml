schema_version = 1

[llm_clients.dynamo]
format = "openai_chat"
base_url = "http://switchyard-gateway/v1"

# Use a private inference endpoint that bypasses this PreProc to avoid recursion.
[llm_clients.judge]
format = "openai_chat"
base_url = "http://qwen-large-frontend:8000/v1"
timeout_ms = 2000
max_retries = 0

[targets.qwen-small]
id = "Qwen/Qwen3-0.6B"
llm_client = "dynamo"

[targets.qwen-large]
id = "Qwen/Qwen3-1.7B"
llm_client = "judge"

[routes.task]
id = "auto"
type = "llm_classifier"
mode = "capability"
classifier_target = "qwen-large"
weak_target = "qwen-small"
strong_target = "qwen-large"
classify_trigger = "new_session"
base_threshold = 0.5
fail_open = true
max_output_tokens = 256

# Illustrative calibration only. Measure these times for your deployment and workload.
# Worker IDs must match every worker in metrics.toml for the respective model.
# Remove this table for task-only routing.
[routes.task.infra]
max_signal_age_ms = 1000
min_waiting_requests = 4
max_capable_inflight = 2
max_spillovers = 2
min_saving_ms = 500.0

[routes.task.infra.efficient_workers.small-a]
batch_size = 4
batch_time_ms = 2000.0
request_time_ms = 1000.0

[routes.task.infra.efficient_workers.small-b]
batch_size = 4
batch_time_ms = 2200.0
request_time_ms = 1100.0

[routes.task.infra.capable_workers]
large = 4000.0
