# Strategic merge patch for Dynamo's existing switchyard-preproc Deployment.
spec:
  template:
    spec:
      containers:
      - name: preproc
        env:
        - name: ROUTES_CONFIG
          value: /etc/switchyard/routes.toml
        - name: METRICS_CONFIG
          value: /etc/switchyard/metrics.toml
      volumes:
      - name: routing-config
        configMap:
          name: switchyard-task-config
