# Helm values for Switchyard when Envoy AI Gateway sits in front.
#
#   helm upgrade --install switchyard deploy/helm/switchyard \
#     --namespace switchyard --create-namespace \
#     -f examples/kubernetes/envoy-ai-gateway-in-front/values.switchyard.yaml

image:
  repository: ghcr.io/nvidia-nemo/switchyard/switchyard-server
  tag: "0.2.0"

# Secret holding NVIDIA_API_KEY. Create it before installing:
#   kubectl -n switchyard create secret generic switchyard-keys \
#     --from-literal=NVIDIA_API_KEY="$NVIDIA_API_KEY"
#
# switchyard-server exits non-zero when an `api_key_env` named below is missing
# from the environment, so a misnamed key surfaces as a crash-looping pod
# rather than as unauthenticated upstream calls.
apiKeySecret:
  name: switchyard-keys

# Switchyard owns provider credentials in this topology and reaches the
# provider directly. The Gateway in front handles ingress concerns only.
config:
  routes: |
    schema_version = 1

    [llm_clients.nvidia]
    format = "openai_chat"
    base_url = "https://inference-api.nvidia.com/v1"
    api_key_env = "NVIDIA_API_KEY"
    max_retries = 2

    # A second client onto the same endpoint, so the judge target has a
    # distinct (model id, client) key.
    #
    # Switchyard deduplicates targets by that pair and drops one of any
    # collision, warning "only one target per id is kept and the other is
    # dropped". The judge and the weak tier are the same model here, so without
    # this they collapse into one target and whichever definition loses is
    # discarded -- silently changing what you deployed. Check the startup log
    # for that warning whenever two targets share a model.
    [llm_clients.nvidia_judge]
    format = "openai_chat"
    base_url = "https://inference-api.nvidia.com/v1"
    api_key_env = "NVIDIA_API_KEY"
    max_retries = 2

    # Three tiers of the same model family. The point of the classifier route
    # below is to spend `ultra` tokens only on the requests that need them.
    [targets.nano]
    id = "nvidia/nvidia/nemotron-3-nano-30b-a3b"
    llm_client = "nvidia"

    [targets.super]
    id = "nvidia/nvidia/nemotron-3-super-v3"
    llm_client = "nvidia"

    [targets.ultra]
    id = "nvidia/nvidia/nemotron-3-ultra"
    llm_client = "nvidia"

    # The classifier judge must return a JSON verdict. A reasoning model can
    # spend its output budget on reasoning_content and leave the JSON
    # truncated, which Switchyard records as
    # `switchyard_classifier_fail_open_total{reason="parse_error"}` and routes
    # to strong_target -- so every judge failure silently spends the expensive
    # tier. On this deployment that metric was non-zero throughout, and most
    # escalations were fail-opens rather than decisions.
    #
    # Prefer a genuinely non-reasoning judge where one is available; upstream's
    # reference config uses google/gemini-3.5-flash for exactly this role.
    #
    # `extra_body` is shallow-merged into the upstream request, so the hint
    # below applies to the judge only and the serving targets keep full
    # reasoning. Treat it as a hint, not a guarantee: whether it suppresses
    # reasoning is model- and prompt-dependent, and it did nothing on some
    # prompts here. `session_affinity` on the route is the more reliable lever,
    # because it runs the judge once per session instead of once per turn.
    #
    # Whatever you configure, alert on classifier_fail_open_total rather than
    # assuming the judge is deciding.
    [targets.judge]
    id = "nvidia/nvidia/nemotron-3-nano-30b-a3b"
    llm_client = "nvidia_judge"
    extra_body = { chat_template_kwargs = { thinking = false } }

    # Single-tier routes, useful as cost and accuracy baselines.
    [routes.nano]
    id = "switchyard/nano"
    type = "passthrough"
    target = "nano"

    [routes.super]
    id = "switchyard/super"
    type = "passthrough"
    target = "super"

    [routes.ultra]
    id = "switchyard/ultra"
    type = "passthrough"
    target = "ultra"

    # Sends each task to `classifier_target` for a capability verdict, then
    # serves it from `weak_target` or `strong_target`.
    #
    # Raise base_threshold to send less traffic to the weak tier. Anything the
    # judge cannot decide goes to strong_target -- which is why the judge is a
    # dedicated target with reasoning suppressed; see [targets.judge] above.
    [routes.classified]
    id = "switchyard/classified"
    type = "llm_classifier"
    mode = "capability"
    classifier_target = "judge"
    weak_target = "nano"
    strong_target = "ultra"
    base_threshold = 0.5
    # The judge otherwise runs on every turn, which is most of the routing
    # cost. Both flags match the reference config in
    # benchmark/server-configs/tb-lite-llm-classifier-opus-kimi-gemini.toml.
    session_affinity = true
    message_hash_fallback = true

    # Even split across tiers, for A/B comparison rather than cost control.
    [routes.general]
    id = "switchyard/general"
    type = "random"
    targets = ["nano", "super", "ultra"]
    weights = [1, 1, 1]
