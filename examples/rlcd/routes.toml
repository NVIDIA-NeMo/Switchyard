schema_version = 1

[llm_clients.rlcd]
format = "openai_chat"
base_url = "http://localhost:8080/v1"
api_key_env = "RLCD_API_KEY"

[llm_clients.openrouter]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[targets.decision]
id = "decision-model"
llm_client = "rlcd"

[targets.strong]
id = "openai/gpt-5"
llm_client = "openrouter"

[targets.weak]
id = "openai/gpt-4o-mini"
llm_client = "openrouter"

[routes.decide]
id = "switchyard/rlcd"
type = "rlcd"
classifier_target = "decision"
targets = ["weak", "strong"]
default_target = "weak"