schema_version = 1

[llm_clients.litellm]
format = "openai_chat"
base_url = "http://litellm:4000/v1"

[llm_clients.litellm.extra_headers]
authorization = "Bearer not-needed"

[targets.strong]
id = "strong"
llm_client = "litellm"

[targets.fast]
id = "fast"
llm_client = "litellm"

[routes.litellm_stage]
id = "litellm-stage"
type = "stage_router"
capable_target = "strong"
efficient_target = "fast"
picker = "efficient_first"
confidence_threshold = 0.5
recent_turn_window = 3
