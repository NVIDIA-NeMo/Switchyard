defaults:
  api_key: not-needed
  base_url: http://litellm:4000/v1
  format: openai
  timeout_secs: 600.0

routes:
  litellm-random:
    type: random_routing
    strong:
      id: strong
      model: strong
    weak:
      id: fast
      model: fast
    strong_probability: 0.5
    rng_seed: 42
    fallback_target_on_evict: strong
    enable_stats: true
