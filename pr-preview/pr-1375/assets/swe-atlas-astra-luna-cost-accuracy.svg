<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 691.2 471.6" width="691.2" height="471.6" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, Arial, sans-serif">
  <title id="title">Switchyard cost and accuracy on SWE-Atlas-QnA</title>
  <desc id="desc">The horizontal axis is Cost Savings vs. Astra Only. Savings decrease from 100% on the left to 0% on the right, placing Luna on the left and Astra on the right. The vertical axis shows task accuracy. All results average three runs. The table below the chart gives the number of tasks solved.</desc>
