  <text x="57.28" y="318.1" font-size="9.6" fill="#546052" text-anchor="end">40%</text>
  <line x1="64.28" y1="256.59" x2="582.68" y2="256.59" stroke="#e3e7e2" stroke-width="0.75"/>
  <text x="57.28" y="260.23" font-size="9.6" fill="#546052" text-anchor="end">50%</text>
  <line x1="64.28" y1="198.72" x2="582.68" y2="198.72" stroke="#e3e7e2" stroke-width="0.75"/>
  <text x="57.28" y="202.37" font-size="9.6" fill="#546052" text-anchor="end">60%</text>
  <line x1="64.28" y1="140.86" x2="582.68" y2="140.86" stroke="#e3e7e2" stroke-width="0.75"/>
