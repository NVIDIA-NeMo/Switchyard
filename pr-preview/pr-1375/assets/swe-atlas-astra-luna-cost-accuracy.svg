  <text x="57.28" y="86.65" font-size="9.6" fill="#546052" text-anchor="end">80%</text>
  <text x="24.3" y="233.44" font-size="11" fill="#20271f" transform="rotate(-90 24.301522 233.442)" font-weight="700" text-anchor="middle">Accuracy</text>
  <line x1="64.28" y1="383.88" x2="582.68" y2="383.88" stroke="#aeb8ad" stroke-width="0.8"/>
  <circle cx="563.3" cy="199.04" r="3.78" fill="#f3b700" stroke="white" stroke-width="1.1"/>
  <circle cx="518.71" cy="206.81" r="3.78" fill="#76b900" stroke="white" stroke-width="1.1"/>
  <circle cx="205.91" cy="270.59" r="3.78" fill="#76b900" stroke="white" stroke-width="1.1"/>
