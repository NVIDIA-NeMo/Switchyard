  <text x="563.3" y="398.18" font-size="9.6" fill="#546052" text-anchor="middle">0%</text>
  <text x="466.4" y="398.18" font-size="9.6" fill="#546052" text-anchor="middle">20%</text>
  <text x="369.51" y="398.18" font-size="9.6" fill="#546052" text-anchor="middle">40%</text>
  <text x="272.61" y="398.18" font-size="9.6" fill="#546052" text-anchor="middle">60%</text>
  <text x="175.71" y="398.18" font-size="9.6" fill="#546052" text-anchor="middle">80%</text>
  <text x="78.82" y="398.18" font-size="9.6" fill="#546052" text-anchor="middle">100%</text>
  <text x="323.48" y="421.45" font-size="11.8" fill="#20271f" font-weight="700" text-anchor="middle">Cost Savings vs. Astra Only</text>
  <line x1="64.28" y1="372.31" x2="582.68" y2="372.31" stroke="#e3e7e2" stroke-width="0.75"/>
