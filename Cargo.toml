[workspace]
resolver = "2"
members = [
    "crates/libsy",
    "crates/libsy-llm-client",
    "crates/switchyard-components",
    "crates/switchyard-py",
    "crates/protocol",
    "crates/switchyard-server",
    "crates/switchyard-skill-distillation",
    "crates/switchyard-translation",
]

[workspace.package]
authors = ["NVIDIA Corporation"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA-NeMo/Switchyard"
rust-version = "1.96.1"

[workspace.dependencies]
async-stream = "0.3"
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
httpdate = "1"
parking_lot = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
switchyard-components = { path = "crates/switchyard-components", version = "0.1.0" }
switchyard-libsy = { path = "crates/libsy", version = "0.1.0" }
switchyard-llm-client = { path = "crates/libsy-llm-client", version = "0.1.0" }
switchyard-protocol = { path = "crates/protocol", version = "0.1.0" }
switchyard-server = { path = "crates/switchyard-server", version = "0.1.0" }
switchyard-translation = { path = "crates/switchyard-translation", version = "0.1.0" }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1", default-features = false, features = ["attributes", "std"] }
