name: Claude plugin

on:
  pull_request:
    paths:
      - ".github/workflows/claude-plugin.yml"
      - "examples/claude/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "LICENSE"
      - "NOTICE"
  push:
    branches: [main]
    paths:
      - ".github/workflows/claude-plugin.yml"
      - "examples/claude/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  claude:
    name: Claude plugin
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm install --global @anthropic-ai/claude-code@2.1.301
      - run: claude plugin validate examples/claude
      - run: claude plugin test examples/claude
      - run: python3 examples/claude/package.py
      - name: Test the extracted package outside the checkout
        run: |
          tar -xzf dist/switchyard-claude-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          claude plugin validate "$RUNNER_TEMP/switchyard-claude-linux-x86_64"
          python3 examples/claude/test_package.py "$RUNNER_TEMP/switchyard-claude-linux-x86_64/switchyard"
      - name: Verify installation enables routing without setup
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-install
        run: |
          claude plugin install switchyard --marketplace "$RUNNER_TEMP/switchyard-claude-linux-x86_64"
          cd "$RUNNER_TEMP"
          claude -p '/switchyard status' --tools '' --strict-mcp-config --mcp-config '{"mcpServers":{}}' > switchyard-status.txt
          grep -F 'Switchyard Auto' switchyard-status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: switchyard-claude-linux-x86_64
          path: dist/switchyard-claude-linux-x86_64.tar.gz
          if-no-files-found: error
