name: Go bindings

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
      GOEXPERIMENT: cgocheck2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bindings/go/go.mod
          # Go's cache does not track the external Rust library or C header.
          cache: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build switchyard-ffi
        run: cargo build -p switchyard-ffi --release --locked
      - name: go test (native)
        working-directory: bindings/go
        run: go test -count=1 -race -tags switchyard_native ./...
      - name: go vet (native)
        working-directory: bindings/go
        run: go vet -tags switchyard_native ./...
      - name: Build and run shared host
        working-directory: bindings/go
        run: |
          go build -tags switchyard_native -buildmode=c-shared -o "$RUNNER_TEMP/libswitchyard_smoke.so" ./testdata/cshared
          cc testdata/cshared.c -I "$RUNNER_TEMP" -L "$RUNNER_TEMP" \
            -Wl,-rpath,"$RUNNER_TEMP" -lswitchyard_smoke -o "$RUNNER_TEMP/shared-host"
          "$RUNNER_TEMP/shared-host"

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bindings/go/go.mod
          cache-dependency-path: bindings/go/go.sum
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build Go WASM module
        run: scripts/build-go-wasm.sh
      - name: go test (WASM, no cgo)
        working-directory: bindings/go
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...
      - name: go vet (WASM, no cgo)
        working-directory: bindings/go
        env:
          CGO_ENABLED: "0"
        run: go vet ./...
      - name: go test (WASM, race)
        working-directory: bindings/go
        env:
          CGO_ENABLED: "1"
        run: go test -count=1 -race ./...
