name: Commitlint

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - name: Install Commitlint
        run: npm install --no-save --package-lock=false --ignore-scripts @commitlint/cli@20.4.1 @commitlint/config-conventional@20.4.1
      - name: Commit messages
        env:
          COMMITLINT_FROM: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          COMMITLINT_TO: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: npx --no-install commitlint --config .commitlintrc.json --from "$COMMITLINT_FROM" --to "$COMMITLINT_TO" --verbose
