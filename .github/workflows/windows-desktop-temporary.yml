name: Temporary Windows desktop validation

on:
  push:
    branches: [emehtabuddin/switch-1633-menubar-route-picker]
    paths:
      - 'crates/**'
      - 'Cargo.*'
      - '.cargo/**'
      - 'scripts/config/**'
      - '.github/workflows/windows-desktop-temporary.yml'

permissions:
  contents: read

concurrency:
  group: temporary-windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99 --profile minimal --component clippy,rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.99
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: temporary-windows-desktop-${{ runner.os }}-1.99-${{ hashFiles('Cargo.lock') }}
          restore-keys: temporary-windows-desktop-${{ runner.os }}-1.99-
      - name: Check Windows desktop and installer
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked -p switchyard-desktop -p switchyard-desktop-install -p switchyard-server --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p switchyard-desktop -p switchyard-desktop-install -p switchyard-server
      - name: Exercise real tasks, running updates, restart, and uninstall
        env:
          SWITCHYARD_WINDOWS_LOG_DIR: ${{ runner.temp }}/switchyard-windows-logs
        run: cargo test --locked -p switchyard-desktop-install --test windows -- --ignored --nocapture
      - name: Save validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-validation
          path: |
            ${{ runner.temp }}/switchyard-windows-logs/*
          if-no-files-found: ignore
      - name: Save Rust build cache
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
