name: Relay native plugin compatibility

on:
  pull_request:
    paths:
      - crates/switchyard-nemo-relay-plugin/**
      - tests/relay_plugin/**
      - Cargo.lock
      - .github/workflows/relay-plugin-compat.yml
  push:
    branches: [main]
    paths:
      - crates/switchyard-nemo-relay-plugin/**
      - tests/relay_plugin/**
      - Cargo.lock
      - .github/workflows/relay-plugin-compat.yml
  workflow_dispatch:
    inputs:
      relay_repository:
        description: Relay repository containing the native error and stream-opening fixes
        default: NVIDIA/NeMo-Relay
        required: true
        type: string
      relay_ref:
        description: Relay branch, tag, or commit to qualify (fixed host required)
        default: main
        required: true
        type: string

permissions:
  contents: read

jobs:
  upstream-errors:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.relay-plugin-target
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          path: switchyard
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.relay_repository || 'NVIDIA/NeMo-Relay' }}
          ref: ${{ inputs.relay_ref || 'main' }}
          path: relay
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev
          rustup toolchain install 1.96.1 --profile minimal
      - name: Build Relay and the locked Switchyard plugin
        run: |
          cargo +1.96.1 build --locked --manifest-path relay/Cargo.toml -p nemo-relay-cli
          cargo +1.96.1 build --locked --manifest-path switchyard/Cargo.toml -p switchyard-nemo-relay-plugin
      - name: Verify upstream denials and healthy native streams
        working-directory: switchyard
        env:
          NEMO_RELAY_TEST_BIN: ${{ github.workspace }}/.relay-plugin-target/debug/nemo-relay
          SWITCHYARD_TEST_PLUGIN_LIBRARY: ${{ github.workspace }}/.relay-plugin-target/debug/libswitchyard_nemo_relay_plugin.so
        run: python3 -m unittest discover -s tests/relay_plugin -p test_upstream_errors.py -v
