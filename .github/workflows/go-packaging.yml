name: Go distributions

on:
  pull_request:
    paths:
      - .github/workflows/go-packaging.yml
      - scripts/release/package_go_bindings.py
      - scripts/release/publish_go_bindings.py
      - tests/test_go_binding_packaging.py
      - tests/test_go_binding_publication.py
      - bindings/go/**
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Require an existing stable Switchyard release tag.
        type: boolean
        default: false
      publish:
        description: Publish the tested Go module. Requires release_candidate and a protected go-release environment.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PACKAGE_MODE: ${{ inputs.release_candidate && 'release' || 'preview' }}

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      source: ${{ steps.version.outputs.source }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate version policy
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          version=$(python3 scripts/release/package_go_bindings.py --mode "$PACKAGE_MODE" --print-version)
          if [ "$PUBLISH" = true ] && { [ "$PACKAGE_MODE" != release ] || [ "$GITHUB_REF" != "refs/tags/$version" ]; }; then
            echo 'Publication requires release_candidate=true and running on the matching stable root tag.' >&2
            exit 1
          fi
          printf 'version=%s\nsource=%s\n' "$version" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check publication prerequisites
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/environments/go-release" \
            --jq 'any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) > 0)')" = true

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: wasm
            target: wasm32-wasip1
            rustflags: ""
          - os: ubuntu-24.04
            artifact: native-linux_amd64
            target: x86_64-unknown-linux-gnu
            rustflags: -C target-cpu=generic -C force-frame-pointers=yes
          - os: ubuntu-24.04-arm
            artifact: native-linux_arm64
            target: aarch64-unknown-linux-gnu
            rustflags: -C target-cpu=generic -C force-frame-pointers=yes
    env:
      TARGET: ${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build library
        run: |
          rustup target add "$TARGET"
          cargo build -p switchyard-ffi --target "$TARGET" --release --locked --lib
          mkdir -p "$RUNNER_TEMP/artifact"
          if [ "$TARGET" = wasm32-wasip1 ]; then
            cp "target/$TARGET/release/switchyard_ffi.wasm" "$RUNNER_TEMP/artifact/"
          else
            cp "target/$TARGET/release/libswitchyard_ffi.a" "$RUNNER_TEMP/artifact/"
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/artifact/SOURCE_COMMIT"
          {
            rustc -Vv
            printf 'RUSTFLAGS=%s\n' "$RUSTFLAGS"
            getconf GNU_LIBC_VERSION
          } > "$RUNNER_TEMP/artifact/build-info.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/artifact/*
          retention-days: 3

  package:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Assemble module
        run: |
          python3 scripts/release/package_go_bindings.py --mode "$PACKAGE_MODE" \
            --artifacts "$RUNNER_TEMP/artifacts" --output "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-distribution-candidate
          path: |
            ${{ runner.temp }}/package/proxy
            ${{ runner.temp }}/package/manifest.json
            ${{ runner.temp }}/package/SHA256SUMS
          retention-days: 3

  consumer:
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bindings/go/go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: go-distribution-candidate
          path: ${{ runner.temp }}/package
      - name: Verify checksums
        working-directory: ${{ runner.temp }}/package
        run: sha256sum -c SHA256SUMS
      - name: Test downloaded module without Rust
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/package"
          read -r module version escaped < <(python3 - "$package_dir/manifest.json" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1]) as file:
              manifest = json.load(file)
          module = manifest["module"]
          print(module, manifest["version"], re.sub(r"[A-Z]", lambda match: "!" + match[0].lower(), module))
          PY
          )
          work=$(mktemp -d)
          archive="$package_dir/proxy/$escaped/@v/$version.zip"
          mkdir -p "$work/dependencies" "$work/proxy" "$work/consumer"
          unzip -p "$archive" "$module@$version/go.mod" > "$work/dependencies/go.mod"
          unzip -p "$archive" "$module@$version/go.sum" > "$work/dependencies/go.sum"
          export GOWORK=off GOTOOLCHAIN=local
          # Fetch and verify only third-party dependencies before testing the unpublished module offline.
          (cd "$work/dependencies" && GOMODCACHE="$work/seed" GOSUMDB=sum.golang.org go mod download)
          cp -R "$work/seed/cache/download/." "$work/proxy/"
          cp -R "$package_dir/proxy/." "$work/proxy/"
          go_root=$(go env GOROOT)
          export PATH="$go_root/bin:/usr/bin:/bin"
          if command -v cargo || command -v rustc; then
              echo "Rust must not be available in the consumer test" >&2
              exit 1
          fi
          unset CGO_CFLAGS CGO_CPPFLAGS CGO_CXXFLAGS CGO_LDFLAGS
          export GOMODCACHE="$work/cache" GOPROXY="file://$work/proxy" GOSUMDB=off
          export GOPRIVATE='' GONOPROXY='' GONOSUMDB=''
          cd "$work/consumer"
          unzip -p "$archive" "$module@$version/testdata/consumer/main.go" > main.go
          go mod init switchyard-consumer.invalid/check
          go get "$module@$version"
          CGO_ENABLED=0 go test -count=1 "$module"
          CGO_ENABLED=1 GOEXPERIMENT=cgocheck2 go test -a -count=1 -race -tags switchyard_native "$module"
          module_dir=$(go list -m -f '{{.Dir}}' "$module")
          extension=so
          if [ "$(go env GOOS)" = darwin ]; then extension=dylib; fi
          CGO_ENABLED=1 go build -tags switchyard_native -buildmode=c-shared \
              -o "$work/libswitchyard_smoke.$extension" "$module/testdata/cshared"
          cc "$module_dir/testdata/cshared.c" -I "$work" -L "$work" \
              -Wl,-rpath,"$work" -lswitchyard_smoke -o "$work/shared-host"
          DYLD_LIBRARY_PATH="$work" "$work/shared-host"
          CGO_ENABLED=1 go mod vendor
          test "$(CGO_ENABLED=0 go run -mod=vendor .)" = wasm
          test "$(CGO_ENABLED=1 go run -mod=vendor -tags switchyard_native .)" = native
          for goos in linux darwin; do
              for goarch in amd64 arm64; do
                  CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -mod=vendor \
                      -o "$work/consumer-$goos-$goarch" .
              done
          done
          echo "Packaged bindings passed without Rust or a local replace: $work"

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'NVIDIA-NeMo/Switchyard' }}
    needs: [version, consumer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: go-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.source }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: go-distribution-candidate
          path: ${{ runner.temp }}/package
      - name: Verify checksums
        working-directory: ${{ runner.temp }}/package
        run: sha256sum -c SHA256SUMS
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bindings/go/go.mod
          cache: false
      - name: Record tested module checksum
        id: candidate
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GOWORK: "off"
          GOTOOLCHAIN: local
          GOPROXY: file://${{ runner.temp }}/package/proxy
          GOSUMDB: "off"
          GOMODCACHE: ${{ runner.temp }}/candidate-module-cache
        working-directory: ${{ runner.temp }}
        run: |
          sum=$(go mod download -json "github.com/NVIDIA-NeMo/Switchyard/bindings/go@$VERSION" | jq -er .Sum)
          printf 'sum=%s\n' "$sum" >> "$GITHUB_OUTPUT"
      - name: Publish immutable Go tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python3 scripts/release/publish_go_bindings.py "$RUNNER_TEMP/package" --push
      - name: Check public module resolution
        env:
          VERSION: ${{ needs.version.outputs.version }}
          EXPECTED_SUM: ${{ steps.candidate.outputs.sum }}
          GOWORK: "off"
          GOTOOLCHAIN: local
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
          GOMODCACHE: ${{ runner.temp }}/published-module-cache
        working-directory: ${{ runner.temp }}
        run: |
          sum=$(go mod download -json "github.com/NVIDIA-NeMo/Switchyard/bindings/go@$VERSION" | jq -er .Sum)
          test "$sum" = "$EXPECTED_SUM"
