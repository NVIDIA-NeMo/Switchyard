{{- if .Values.apiKeySecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "switchyard.apiKeySecretName" . }}
  labels:
    {{- include "switchyard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.apiKeySecret.data }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
